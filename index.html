<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>metrobox setup</title>
<style>
  :root {
    --bg: #0d0f12;
    --panel: #16191f;
    --panel-hi: #1e222a;
    --line: #2a2f39;
    --text: #e8eaed;
    --muted: #9aa3af;
    --train: #00a500;   /* GREEN 0x0520 — the display's active-status colour */
    --ok: #35c46b;
    --err: #ff5c5c;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: 32px 20px 64px; }

  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 32px; }

  .step { margin-bottom: 28px; }
  .step-label {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 13px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted); margin-bottom: 10px;
  }
  .step-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--panel-hi); color: var(--text);
    font-size: 11px; letter-spacing: 0; flex: none;
  }

  input {
    width: 100%; padding: 12px 14px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
    font-size: 16px; font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--train); }
  input:disabled { color: var(--muted); cursor: not-allowed; }
  /* One field, with a ghost layer painting the MB- prefix and the remaining
     X placeholders. The input itself holds only the digits and renders its
     text transparent, so the real caret is the one you see.

     Grid overlap rather than absolute positioning: both children share one
     cell, so identical font and padding put the ghost's characters exactly
     where the input's would be. Monospace is required — the 3ch left padding
     that shifts the digits clear of "MB-" is only exact in a fixed-width font,
     and letter-spacing would break it. */
  /* Letter-spacing widens every character advance from 1ch to (1ch + --ls),
     so the offset that lines the input's digits up with the ghost has to use
     the same figure. Kept in one variable so the two cannot drift apart. */
  .code-field { display: grid; --ls: 0.1em; }
  .code-field > * { grid-area: 1 / 1; }
  .code-field input,
  .code-ghost {
    font: 24px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: var(--ls);
    padding: 12px 14px;
    border: 1px solid transparent;
    border-radius: 8px;
  }
  .code-field input {
    width: 100%;
    background: var(--panel);
    border-color: var(--line);
    color: transparent;
    caret-color: var(--train);
    /* The ghost is always 9 characters wide, so it centres predictably: the
       block starts at 50% - 4.5 advances and the digits begin 3 advances into
       it, leaving the input's text to start 1.5 advances left of centre. */
    text-align: left;
    padding-left: calc(50% - 1.5ch - 1.5 * var(--ls));
  }
  .code-field input:focus { outline: none; border-color: var(--train); }
  /* The ghost must come after the input in the DOM: the input's background is
     opaque and would otherwise paint straight over it. Its own background stays
     transparent so the input's caret shows through. */
  .code-ghost {
    pointer-events: none;
    white-space: pre;
    background: none;
    color: var(--train);
    text-align: center;
  }
  .code-ghost .g-rest { color: var(--muted); }

  .hint { color: var(--muted); font-size: 13px; margin-top: 8px; }

  #list {
    margin-top: 10px; max-height: 340px; overflow-y: auto;
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
  }
  .station {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px; cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .station:last-child { border-bottom: none; }
  .station:hover { background: var(--panel-hi); }
  .station[aria-selected="true"] { background: var(--panel-hi); box-shadow: inset 3px 0 0 var(--train); }
  .station-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* A row that is a message rather than a choice — "Loading…", "no match". */
  .station.note { cursor: default; color: var(--muted); }
  .station.note:hover { background: none; }

  .chips { display: flex; gap: 4px; flex: none; align-items: center; }
  /* One shape per system. WMATA lines are identified by colour alone, so a
     plain dot carries all of it. MTA and BART both need the letter — 1/2/3 are
     one red and 4/5/6 one green, and BART's codes *are* the colours — which is
     the same split displayStationLines() makes in the firmware. */
  .chip { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .chip.bullet, .chip.tile {
    width: 19px; height: 19px;
    display: inline-flex; align-items: center; justify-content: center;
    font: 700 12px/1 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color: #fff;
  }
  /* 2px, the same radius the panel rounds these to (line_shape_corner_radius
     is 2 for BART in every DisplayProfile). */
  .chip.tile { border-radius: 2px; }
  /* Black on the light fills — the MTA's N/Q/R/W yellow, BART's yellow and
     orange; white on everything else. Same rule as getLineTextColor(). */
  .chip.on-light { color: #000; }

  button {
    width: 100%; padding: 14px; margin-top: 8px;
    background: var(--train); color: #04150a;
    border: 0; border-radius: 8px;
    font: 700 16px/1 inherit; cursor: pointer;
  }
  button:disabled { background: var(--panel-hi); color: var(--muted); cursor: not-allowed; }

  /* Overrides the block above, so it has to come after it. */
  /* One system per row, full width, however many systems there are: the list
     reads top to bottom and another system just adds another row.

     Capped and scrolled past roughly five rows. Left uncapped, the page grew a
     screenful of chrome above step 3 as systems were added, which pushed the
     station picker — the part with the actual work in it — below the fold. The
     cap is deliberately not a whole number of rows: a half-visible card is what
     says "there is more here" without needing a scrollbar to be drawn. */
  .systems {
    display: grid; gap: 10px;
    grid-template-columns: 1fr;
    max-height: 292px; overflow-y: auto;
    /* Room for an overlay scrollbar, so it does not sit on top of the text. */
    padding-right: 4px;
    /* Overlay scrollbars on macOS only appear while scrolling, so the cap on
       its own left no sign the list continued. The mask fades whichever edge
       has content beyond it — half a faded card reads as "more this way" at a
       glance, which turned out to be enough on its own: this replaced a pair
       of explicit page-up/page-down buttons in the step label. Both edges are
       square when neither class is set, so a list that fits is untouched. */
    --fade: 28px;
    mask-image: linear-gradient(to bottom, #000 0, #000 100%);
  }
  .systems.can-up:not(.can-down) {
    mask-image: linear-gradient(to bottom, transparent 0, #000 var(--fade));
  }
  .systems.can-down:not(.can-up) {
    mask-image: linear-gradient(to top, transparent 0, #000 var(--fade));
  }
  .systems.can-up.can-down {
    mask-image: linear-gradient(to bottom, transparent 0, #000 var(--fade),
                                #000 calc(100% - var(--fade)), transparent 100%);
  }
  .system {
    width: auto; margin: 0; padding: 13px 14px;
    text-align: left;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
    font: inherit; cursor: pointer;
    /* Title and subtitle sit side by side on the row, and drop to two lines
       only when the row is too narrow to hold both. */
    display: flex; flex-wrap: wrap; align-items: baseline;
    gap: 4px 10px;
  }
  .system:hover:not(:disabled) { background: var(--panel-hi); }
  /* Border only, the same 1px on all four sides. An inset left bar used to sit
     inside the border too, which stacked into a 4px left edge against 1px
     everywhere else and read as a lopsided box. */
  .system[aria-checked="true"] {
    background: var(--panel-hi);
    border-color: var(--train);
  }
  .system:disabled {
    background: var(--panel); color: var(--muted);
    cursor: not-allowed; opacity: 0.55;
  }
  .system-title { font-weight: 600; font-size: 15px; }
  .system-subtitle { font-size: 13px; color: var(--muted); }

  /* The design picker reuses .system's card, so the two pickers read as the
     same control. It has no scroll cap of its own: a system offers two or
     three boards, not nine, and there is nothing below it to push off-screen. */
  .designs { display: grid; gap: 10px; grid-template-columns: 1fr; }

  /* The still sits under the cards it describes and is deliberately not one:
     no border and no panel fill, or a third card appears below the two real
     ones. The frame keeps the box's height while the next image decodes, so
     switching boards doesn't jump the Save button up the page. */
  .preview { margin: 10px 0 0; aspect-ratio: 5 / 2; }
  .preview img {
    display: block; width: 100%; height: 100%;
    object-fit: contain; border-radius: 8px;
  }

  /* Step 4 holds two unrelated kinds of control — which board to draw, and how
     that board behaves — so each gets its own heading. Subordinate to the step
     label above it: same size and weight, but sentence case rather than the
     tracked-out caps, so the two never read as peers. */
  .section + .section { margin-top: 20px; }
  .section-label {
    font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 10px;
  }

  /* These are not boards, so they must not wear the boards' card. The
     constraint predates them: a single "Flash arriving trains" row in .system's
     border and panel fill sat directly under the picker in the picker's own
     language and read as a third design to choose. Three of them, immediately
     below two real cards, would read as five.

     So the box is dropped and the state is carried by a radio mark, which
     nothing above has — the design picker states itself with a border and a
     fill and no mark at all. Two controls, two vocabularies, and the marks are
     also what says these three are one choice rather than three switches. */
  .effects { display: grid; gap: 2px; grid-template-columns: 1fr; }
  .effect {
    width: auto; margin: 0; padding: 8px 2px 8px 0;
    text-align: left; background: none; border: 0;
    font: inherit; color: var(--text); cursor: pointer;
    display: grid; grid-template-columns: auto 1fr; align-items: start;
    gap: 1px 12px;
  }
  .effect:focus-visible { outline: 2px solid var(--train); outline-offset: 2px; border-radius: 8px; }
  /* Every cell placed by hand. The mark is the only child with a row span, and
     auto-placement resolves those first: left implicit, it took the whole first
     column and pushed the title out beside it. */
  .effect .system-title { grid-column: 2; grid-row: 1; font-weight: 500; }
  .effect .system-subtitle { grid-column: 2; grid-row: 2; }
  .mark {
    grid-column: 1; grid-row: 1 / span 2;
    position: relative; flex: none;
    width: 17px; height: 17px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--panel);
    /* Centred on the title rather than on the two lines together: the title is
       the line the mark belongs to, and centring on the pair left it floating
       between them on the options with a subtitle. */
    align-self: start; margin-top: 3px;
    transition: border-color 0.15s;
  }
  .mark::after {
    content: ""; position: absolute; inset: 3px;
    border-radius: 50%; background: var(--train);
    transform: scale(0); transition: transform 0.15s;
  }
  .effect[aria-checked="true"] .mark { border-color: var(--train); }
  .effect[aria-checked="true"] .mark::after { transform: scale(1); }

  .msg { margin-top: 14px; padding: 12px 14px; border-radius: 8px; font-size: 14px; display: none; }
  .msg.show { display: block; }
  .msg.ok  { background: rgba(53,196,107,0.12); color: var(--ok); }
  .msg.err { background: rgba(255,92,92,0.12); color: var(--err); }

</style>
</head>
<body>
<main>
  <h1>Set up your Metrobox</h1>
  <p class="sub">Choose a system and station to display arrivals for.</p>

  <div class="step">
    <div class="step-label" id="code-label"><span class="step-num">1</span> Metrobox Code</div>
    <div class="code-field">
      <input id="code" autocomplete="off" spellcheck="false" inputmode="numeric"
             aria-labelledby="code-label" aria-describedby="code-hint">
      <div class="code-ghost" aria-hidden="true"><span class="g-pre">MB-</span><span id="g-typed"></span><span class="g-rest" id="g-rest">XXXXXX</span></div>
    </div>
    <div class="hint" id="code-hint">Shown on screen when booting up the device.</div>
  </div>

  <div class="step">
    <div class="step-label"><span class="step-num">2</span> <span id="system-label">Select transit system</span></div>
    <div class="systems" id="systems" role="radiogroup" aria-labelledby="system-label"></div>
  </div>

  <!-- Hidden until a system is chosen: there is nothing to say in it before
       then, and an empty box explaining why it is empty is just clutter. -->
  <div class="step" id="station-step" hidden>
    <div class="step-label" id="station-label"><span class="step-num">3</span> Select station</div>
    <input id="search" placeholder="Search stations…" autocomplete="off"
           aria-labelledby="station-label" disabled>
    <div id="list"><div class="station note"><span class="station-name">Loading stations…</span></div></div>
  </div>

  <!-- Hidden for every system with only one board, which is all of them but
       New York today. A step offering a single choice is not a choice, and
       drawing it would put a dead control between the station list and Save. -->
  <div class="step" id="design-step" hidden>
    <div class="step-label"><span class="step-num">4</span> Display Settings</div>

    <div class="section">
      <div class="section-label" id="design-label">Display style</div>
      <div class="designs" id="designs" role="radiogroup" aria-labelledby="design-label"></div>
      <!-- What the selected board actually looks like on the device. Hidden
           rather than left blank when a board ships without a still, so the
           step never holds an empty frame. -->
      <figure class="preview" id="design-preview" hidden>
        <img id="design-preview-img" alt="">
      </figure>
    </div>

    <!-- Settings that belong to the board selected above rather than to the
         system, so they appear and disappear with it. Hidden whenever the
         chosen board has nothing to set. -->
    <div class="section" id="effects-section" hidden>
      <div class="section-label" id="effects-label">Display effect for shortly arriving trains</div>
      <div class="effects" id="effects" role="radiogroup" aria-labelledby="effects-label"></div>
    </div>

    <!-- BART's call-out. Its own section rather than another row of the one
         above, because the two are never both on screen and a shared heading
         would have to describe both at once. -->
    <div class="section" id="takeover-section" hidden>
      <div class="section-label" id="takeover-label">Arriving trains</div>
      <div class="effects" id="takeover" role="radiogroup" aria-labelledby="takeover-label"></div>
    </div>
  </div>

  <button id="save" disabled>Save Configuration</button>
  <div id="msg" class="msg"></div>
</main>

<script>
// The only address this page hardcodes, same as the firmware. Everything else
// comes back from discovery, so the readers stay movable.
const DISCOVERY_URL = "https://pvjwz2rcl3.execute-api.us-east-1.amazonaws.com/api/discovery";
const API_BASE = DISCOVERY_URL.replace(/\/api\/discovery$/, "");

// Official WMATA line colours, keyed by the codes the station feed returns.
const WMATA_COLORS = {
  RD: "#BF0D3E", BL: "#009CDE", YL: "#FFD100",
  OR: "#ED8B00", GR: "#00B140", SV: "#919D9D",
};

// MTA trunk-line colours, keyed by the single-character bullet the station
// feed returns. The groupings are the ones getMTALineArrivalsColor() in
// metrobox_utils.cpp uses, so a station's bullets here are the bullets its
// display draws; the panel is 16-bit and rounds these, which is the only
// difference (MTA_RED 0xE9A5 is #EE352E after the round trip).
const MTA_COLORS = {
  "1": "#EE352E", "2": "#EE352E", "3": "#EE352E",                    // MTA_RED
  "4": "#00933C", "5": "#00933C", "6": "#00933C",                    // MTA_GREEN
  "7": "#B933AD",                                                    // MTA_PURPLE
  "A": "#0039A6", "C": "#0039A6", "E": "#0039A6",                    // MTA_BLUE
  "B": "#FF6319", "D": "#FF6319", "F": "#FF6319", "M": "#FF6319",    // MTA_ORANGE
  "G": "#6CBE45",                                                    // MTA_LTGREEN
  "J": "#996633", "Z": "#996633",                                    // MTA_BROWN
  "L": "#A7A9AC",                                                    // MTA_GREY
  "N": "#FCCC0A", "Q": "#FCCC0A", "R": "#FCCC0A", "W": "#FCCC0A",    // MTA_YELLOW
  "S": "#808183",                                                    // MTA_SHUTTLE
};
const MTA_DARK_TEXT = new Set(["N", "Q", "R", "W"]);

// BART line colours. BART names its lines by colour, so the single-character
// codes the station feed serves are the colour itself. Same round-trip note as
// the MTA palette above: the panel is 16-bit and rounds these (BART_RED 0xE8E4
// is #ED1C24 landing on #EE1C20), and BART_* in metrobox_utils.h is the same
// set.
const BART_COLORS = {
  R: "#ED1C24", O: "#FF9933", Y: "#FFFF33", G: "#4DB848", B: "#00AEEF",
};
// The codes are the colour names, so the letter on the tile is R/O/Y/G/B.
// Yellow and orange are the light fills here — the same call getLineTextColor()
// makes on the panel — and take black text; the rest are white.
const BART_DARK_TEXT = new Set(["Y", "O"]);
// Spectrum order, matching LINE_CODES in the bart_station_info poller, which
// is where the order is really decided — the firmware draws the blob's list as
// it arrives. Repeated here so the picker is right during the window where the
// deployed blob still holds the old route_id order (the daily rule can be up
// to 24h from re-running), and harmless once it doesn't.
const BART_ORDER = ["R", "O", "Y", "G", "B"];

// The systems this page knows how to present. Which of them a user can
// actually pick is decided by discovery — an entry with no station-info URL
// renders disabled rather than silently missing, because "New York isn't
// there" is a deployment state worth seeing rather than a blank space.
//
// "id" is the string POSTed as "system" and the key discovery files a system
// under; it is also what systemFromName() in the firmware matches on, so all
// three have to agree. Two agencies run two systems each, so the id is the
// system and not the operator: "wmata" is the rail network it has always been
// and the bus network is "wmata_bus", which keeps every already-paired display
// pointing where it was pointing.
//
// Entries below with `chip: null` have no poller yet — they render disabled
// until discovery serves them, and their line codes are whatever that poller
// ends up writing. The palette is deliberately not guessed here: getLineColor()
// in the firmware has to agree with it code for code, so it is decided once,
// when there is a feed to read it from.
const SYSTEMS = [
  {
    id: "wmata",
    title: "Washington Metro Rail",
    subtitle: "WMATA",
    searchHint: "Search stations…",
    chip: (line) => dotChip(WMATA_COLORS[line] || "#666", line),
    // The first entry is the default, and here it is the retro rows rather
    // than the modern board — Washington leads with the rows. The order is
    // per-system on purpose: which board a city leads with is a fact about
    // that city, not a shape this list repeats everywhere.
    designs: [
      {
        id: "classic",
        title: "Retro",
        preview: "previews/wmata-retro.png",
      },
      {
        id: "modern",
        title: "Modern",
        preview: "previews/wmata-modern.png",
        // No arrivingEffect: WMATA's own signs say BRD in the column where the
        // wait goes, so the board already calls an arriving train out where a
        // rider is looking and there is no effect to choose between.
      },
    ],
  },
  {
    id: "mta",
    title: "New York City Subway",
    subtitle: "MTA",
    // Several New York stations share a name — there are four "86 St" — so the
    // bullets are how you tell them apart, and searching one is fair game.
    searchHint: "Search by station or line…",
    chip: (line) => bulletChip(MTA_COLORS[line] || "#666", line),
    searchLines: true,
    // The first entry is the system's default and is what a device that has
    // never been given a design already draws, so leaving this step alone
    // changes nothing.
    designs: [
      {
        id: "modern",
        title: "Modern",
        preview: "previews/mta-modern.png",
        // This board marks an arriving train, and is the only one that does —
        // the retro rows have no equivalent — so the choice of *how* hangs off
        // the design rather than off the system.
        arrivingEffect: true,
      },
      {
        id: "classic",
        title: "Retro",
        preview: "previews/mta-retro.png",
      },
    ],
  },
  {
    id: "bart",
    title: "Bay Area Rapid Transit",
    subtitle: "BART",
    searchHint: "Search stations…",
    chip: (line) => tileChip(BART_COLORS[line] || "#666", line),
    lineOrder: BART_ORDER,
    // Retro first, so the Bay Area leads with the rows the way Washington
    // does. Not a house style: BART's platforms are still mostly the red LED
    // signs these imitate, and the default should be the sign a rider walking
    // up to one actually sees.
    //
    // Both entries carry arrivingTakeover, which is the difference between
    // this system and the other two. New York's effect hangs off one board
    // because only that board marks an arriving train; BART's call-out is a
    // behaviour of the *sign*, and both of its boards do it — the retro one in
    // characters, the modern one in type and dashes. So the setting follows
    // BART rather than following a board, and switching between the two here
    // leaves it standing.
    //
    // No previews yet: there are no stills of either BART board to link, and
    // renderPreview() drops the frame rather than showing a broken one. They
    // slot in the day someone photographs a panel.
    designs: [
      {
        id: "classic",
        title: "Retro",
        arrivingTakeover: true,
      },
      {
        id: "modern",
        title: "Modern",
        arrivingTakeover: true,
      },
    ],
  },

  // ---- Not served yet. Titles are what a rider in that city calls the thing,
  // since that is what the picker is read as.
  {
    id: "septa",
    title: "Philadelphia Metro",
    subtitle: "SEPTA",
    searchHint: "Search stations…",
    chip: null,
  },
  {
    id: "wmata_bus",
    title: "Washington Metro Bus",
    subtitle: "WMATA",
    searchHint: "Search stops…",
    // A bus stop is served by however many routes happen to pass it, and the
    // route names are not a small fixed set the way a rail network's are.
    // Whatever these get, it will not be the rail bullet.
    chip: null,
  },
  {
    id: "mbta",
    title: "Boston Subway",
    subtitle: "MBTA",
    searchHint: "Search stations…",
    chip: null,
  },
  {
    id: "cta",
    title: "Chicago L",
    subtitle: "CTA",
    searchHint: "Search stations…",
    chip: null,
  },
  {
    id: "lacmta",
    title: "Los Angeles Metro Rail",
    subtitle: "LACMTA",
    searchHint: "Search stations…",
    chip: null,
  },
  {
    id: "mta_bus",
    title: "New York City Bus",
    subtitle: "MTA",
    searchHint: "Search stops…",
    chip: null,
  },
];

// Alphabetical by title, which is the only order that stays sensible as this
// list grows — the original three were in the order they were built, and that
// is not a fact a rider looking for their city knows.
//
// localeCompare rather than the numeric-aware collator below: these are city
// names with no digits in them, and the collator is declared further down —
// this runs at load, before that binding exists.
SYSTEMS.sort((a, b) => a.title.localeCompare(b.title));

// What the picker actually draws: everything served first, then everything
// not, each half still alphabetical. With most of the list unbuilt, plain
// alphabetical buried the three real choices among six dead ones — Boston and
// Chicago sat above New York. The base order above is what this falls back to
// before discovery answers, when nothing is known to be missing yet.
function systemsInPickerOrder() {
  if (!discoveryDone) return SYSTEMS;
  const rank = (s) => (stationUrls[s.id] ? 0 : 1);
  return SYSTEMS.slice().sort((a, b) => rank(a) - rank(b));
}

const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]
  );
}

// Numeric-aware, because most of the New York list is street numbers and a
// plain sort files "103 St" between "10 Av" and "104 St".
const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" });

let system = null;              // entry from SYSTEMS
let stationUrls = {};           // system id -> station-info URL from discovery
let stationCache = {};          // system id -> [{code, name, lines}]
let stations = [];              // the list currently on screen
let selected = null;
// Which board the chosen system should draw. Null for a system that offers
// only one, which is the same thing as "the system's default" — the field is
// then left out of the POST entirely rather than sent empty, so a system with
// no choice to make writes nothing about designs.
let design = null;
// How the chosen board should call out a train that is arriving. Only
// meaningful for a board that marks one at all, and left out of the POST
// entirely when the chosen one does not — see effectApplies().
//
// "flash" to start, like the device: this page writes a configuration, it does
// not read the one already on the display, so every control here begins at its
// default and a save states the whole selection. Same as `design` above, which
// also goes back to the system's first board rather than to whatever the
// device happens to be drawing.
let arrivingEffect = "flash";
// Whether an arriving train takes over BART's board. A separate control from
// the effect above rather than two more entries on it, because it is not the
// same question: New York's effect decorates one row and leaves the board
// alone, where BART's call-out hands the arriving train the whole screen for a
// moment. Folding them together would let a display re-pointed from New York to
// the Bay Area read "flash" as an answer about the takeover.
//
// "full" to start, and this is the one control here whose default is not the
// behaviour a device already has — no BART display drew anything for an
// arriving train before this existed. It leads because it is what BART's own
// platform signs do.
let arrivingTakeover = "full";

function dotChip(color, line) {
  return `<span class="chip" style="background:${color}" title="${esc(line)}"></span>`;
}

function bulletChip(color, line) {
  const dark = MTA_DARK_TEXT.has(line) ? " on-light" : "";
  return `<span class="chip bullet${dark}" style="background:${color}" title="${esc(line)}">${esc(line)}</span>`;
}

function tileChip(color, line) {
  const dark = BART_DARK_TEXT.has(line) ? " on-light" : "";
  return `<span class="chip tile${dark}" style="background:${color}" title="${esc(line)}">${esc(line)}</span>`;
}

function chipsFor(lines) {
  // No chip renderer means the system's line codes aren't known yet — draw the
  // name on its own rather than a row of grey unknowns.
  if (!system || !system.chip) return "";
  let ordered = lines || [];
  if (system.lineOrder) {
    // Unknown codes keep their relative place at the end rather than being
    // dropped or sorted to the front — a new line the page hasn't been told
    // about should still show up.
    const rank = (c) => {
      const i = system.lineOrder.indexOf(c);
      return i === -1 ? system.lineOrder.length : i;
    };
    ordered = ordered.slice().sort((a, b) => rank(a) - rank(b));
  }
  return ordered.map(system.chip).join("");
}

// ------------------------------------------------------------------ systems

function renderSystems() {
  $("systems").innerHTML = systemsInPickerOrder().map((s) => {
    // Before discovery answers, nothing is known to be missing yet, so tiles
    // stay live rather than flashing disabled and back.
    const ready = !discoveryDone || Boolean(stationUrls[s.id]);
    return `<button type="button" class="system" role="radio" data-id="${s.id}"
                    aria-checked="${system !== null && system.id === s.id}"
                    ${ready ? "" : "disabled"}>
              <span class="system-title">${esc(s.title)}</span>
              <span class="system-subtitle">${ready ? esc(s.subtitle) : "Not available yet"}</span>
            </button>`;
  }).join("");

  for (const el of $("systems").children) {
    el.onclick = () => selectSystem(el.dataset.id);
  }

  // Replacing innerHTML resets the container's scrollTop, and the container
  // scrolls now — so picking a system below the fold would re-render and jump
  // the list back to the top, taking the card you just clicked out of view.
  const checked = $("systems").querySelector('[aria-checked="true"]');
  if (checked) checked.scrollIntoView({ block: "nearest" });

  refreshSystemsScroll();
}

// ---- which edges of the list have more content past them

function refreshSystemsScroll() {
  const box = $("systems");
  const max = box.scrollHeight - box.clientHeight;
  // Sub-pixel layout means scrollTop rarely lands exactly on 0 or max.
  const overflows = max > 1;
  box.classList.toggle("can-up", overflows && box.scrollTop > 1);
  box.classList.toggle("can-down", overflows && box.scrollTop < max - 1);
}

async function selectSystem(id) {
  const next = SYSTEMS.find((s) => s.id === id);
  if (!next || (system && system.id === id)) return;

  system = next;
  selected = null;
  stations = [];
  // Back to the new system's default board rather than carrying the last
  // system's pick across — "classic" chosen for New York means nothing in
  // Washington, and would be wrong again on the way back if New York's
  // default ever moves.
  design = next.designs ? next.designs[0].id : null;
  // Any standing message referred to the system being left — a "Saved!" for a
  // station in another city is worse than no message at all.
  clearMessage();
  $("search").value = "";
  $("search").placeholder = system.searchHint;
  $("station-step").hidden = false;
  renderSystems();
  renderDesigns();
  refreshButton();

  await loadStations();
}

// ------------------------------------------------------------------ designs

function renderDesigns() {
  const options = (system && system.designs) || [];
  // One option is not a choice; none is not a step. Either way there is
  // nothing to draw, and the container is left empty so a system switched away
  // from doesn't leave its boards behind it.
  $("design-step").hidden = options.length < 2;
  if (options.length < 2) {
    $("designs").innerHTML = "";
    renderPreview();
    renderEffects();
    renderTakeover();
    return;
  }

  $("designs").innerHTML = options.map((d) =>
    `<button type="button" class="system" role="radio" data-id="${esc(d.id)}"
             aria-checked="${design === d.id}">
       <span class="system-title">${esc(d.title)}</span>
     </button>`
  ).join("");

  for (const el of $("designs").children) {
    el.onclick = () => selectDesign(el.dataset.id);
  }

  renderPreview();
  renderEffects();
  renderTakeover();
}

// The still for the selected board. The src is only ever written when it
// changes: reassigning the same one restarts the decode and flickers the frame
// on every re-render of the picker.
function renderPreview() {
  const options = (system && system.designs) || [];
  const chosen = options.find((d) => d.id === design);
  const src = (chosen && chosen.preview) || null;
  const fig = $("design-preview");
  const img = $("design-preview-img");

  fig.hidden = !src;
  if (!src) {
    // Dropped rather than left standing, so a system without stills doesn't
    // keep the last one it had loaded behind a hidden frame.
    img.removeAttribute("src");
    img.alt = "";
    return;
  }

  if (!img.getAttribute("src") || img.getAttribute("src") !== src) {
    img.setAttribute("src", src);
  }
  img.alt = `${chosen.title} display for ${system.subtitle}`;
}

function selectDesign(id) {
  if (design === id) return;
  design = id;
  // Any standing "Saved!" was for the board that was selected a moment ago.
  clearMessage();
  renderDesigns();
}

// ---- settings belonging to the selected board rather than to the system

// The ids are the strings the server stores and the firmware parses, so this
// list is the setting — a fourth entry here is a change to all three at once.
//
// Ordered as a ladder rather than by preference: each option takes an element
// away from the one above it, which is also why the flash cannot be had
// without the outline. The outline is the still half of the flash, not a
// separate mark that could be turned off under it.
const ARRIVING_EFFECTS = [
  {
    id: "flash",
    title: "Outline + flash",
  },
  {
    id: "outline",
    title: "Outline only",
  },
  {
    id: "none",
    title: "No effect",
  },
];

// Whether the chosen board marks an arriving train at all. The POST asks the
// same question, so both sides agree without either restating which board that
// is.
function effectApplies() {
  const options = (system && system.designs) || [];
  const chosen = options.find((d) => d.id === design);
  return Boolean(chosen && chosen.arrivingEffect);
}

function renderEffects() {
  const applies = effectApplies();
  // The section, not the group: hiding the group alone would leave the
  // "Arriving trains" heading standing over nothing.
  $("effects-section").hidden = !applies;
  if (!applies) {
    // Emptied rather than left in place, so a board switched away from does not
    // keep a hidden radio group holding the previous selection's markup.
    $("effects").innerHTML = "";
    return;
  }

  $("effects").innerHTML = ARRIVING_EFFECTS.map((e) =>
    `<button type="button" class="effect" role="radio" data-id="${esc(e.id)}"
             aria-checked="${arrivingEffect === e.id}">
       <span class="mark" aria-hidden="true"></span>
       <span class="system-title">${esc(e.title)}</span>
     </button>`
  ).join("");

  for (const el of $("effects").children) {
    el.onclick = () => selectEffect(el.dataset.id);
  }
}

function selectEffect(id) {
  if (arrivingEffect === id) return;
  arrivingEffect = id;
  // Any standing "Saved!" described the display as it was configured a moment
  // ago, which is no longer what this form says.
  clearMessage();
  renderEffects();
}

// The ids the server stores and the firmware parses, the same contract
// ARRIVING_EFFECTS above holds. Two rather than three: the call-out is a thing
// the board either does or does not do, and there is no half of it to keep the
// way an outline is the still half of a flash.
const ARRIVING_TAKEOVERS = [
  {
    id: "full",
    title: "Take over the screen",
  },
  {
    id: "none",
    title: "No call-out",
  },
];

// Whether the chosen board hands an arriving train the whole screen. Asked of
// the design like effectApplies(), so the two controls are configured the same
// way — but every BART board answers yes, which is what makes the control sit
// still while a rider switches between them.
function takeoverApplies() {
  const options = (system && system.designs) || [];
  const chosen = options.find((d) => d.id === design);
  return Boolean(chosen && chosen.arrivingTakeover);
}

function renderTakeover() {
  const applies = takeoverApplies();
  $("takeover-section").hidden = !applies;
  if (!applies) {
    $("takeover").innerHTML = "";
    return;
  }

  $("takeover").innerHTML = ARRIVING_TAKEOVERS.map((t) =>
    `<button type="button" class="effect" role="radio" data-id="${esc(t.id)}"
             aria-checked="${arrivingTakeover === t.id}">
       <span class="mark" aria-hidden="true"></span>
       <span class="system-title">${esc(t.title)}</span>
     </button>`
  ).join("");

  for (const el of $("takeover").children) {
    el.onclick = () => selectTakeover(el.dataset.id);
  }
}

function selectTakeover(id) {
  if (arrivingTakeover === id) return;
  arrivingTakeover = id;
  clearMessage();
  renderTakeover();
}

// ----------------------------------------------------------------- stations

function note(text) {
  $("list").innerHTML = `<div class="station note"><span class="station-name">${esc(text)}</span></div>`;
}

async function loadStations() {
  const id = system.id;

  if (stationCache[id]) {
    stations = stationCache[id];
    renderList();
    $("search").disabled = false;
    return;
  }

  $("search").disabled = true;
  note("Loading stations…");

  const url = stationUrls[id];
  if (!url) {
    note(`${system.title} isn't being served yet.`);
    return;
  }

  try {
    const data = await fetch(url).then((r) => r.json());
    const list = Object.entries(data)
      .map(([code, s]) => ({ code, name: s.name, lines: s.lines || [] }))
      .sort((a, b) => collator.compare(a.name, b.name) || collator.compare(a.code, b.code));

    // A system whose daily poller has never succeeded serves {} rather than
    // failing, which would otherwise read as "no stations match".
    if (!list.length) {
      note(`No stations published for ${system.title} yet.`);
      return;
    }

    stationCache[id] = list;
    // The await above means another tile may have been clicked meanwhile;
    // caching is still worth keeping, drawing the stale list is not.
    if (system.id !== id) return;

    stations = list;
    renderList();
    $("search").disabled = false;
  } catch (err) {
    if (system.id !== id) return;
    note("Couldn't load stations — is the server up?");
    say(`Station list failed: ${err.message}`, "err");
  }
}

function matches(s, q) {
  if (!q) return true;
  if (s.name.toLowerCase().includes(q) || s.code.toLowerCase().includes(q)) return true;
  // Only where a bullet is a name a rider would type: "Q" as a WMATA station
  // code fragment is noise, as a New York line it is the whole point.
  return Boolean(system.searchLines) && (s.lines || []).some((l) => l.toLowerCase() === q);
}

function renderList(filter = "") {
  const q = filter.trim().toLowerCase();
  const shown = stations.filter((s) => matches(s, q));

  if (!shown.length) {
    note(`No station matches “${filter}”`);
    return;
  }

  $("list").innerHTML = shown
    .map(
      (s) => `<div class="station" role="option" data-code="${esc(s.code)}"
                   aria-selected="${selected !== null && selected.code === s.code}">
                <span class="station-name">${esc(s.name)}</span>
                <span class="chips">${chipsFor(s.lines)}</span>
              </div>`
    )
    .join("");

  for (const el of $("list").children) {
    el.onclick = () => {
      selected = stations.find((s) => s.code === el.dataset.code);
      renderList($("search").value);
      refreshButton();
    };
  }
}

// --------------------------------------------------------------------- code

const CODE_DIGITS = 6;

function codeDigits() {
  return $("code").value.replace(/\D/g, "").slice(0, CODE_DIGITS);
}

function codeValue() {
  const d = codeDigits();
  return d.length === CODE_DIGITS ? `MB-${d}` : null;
}

// Keeps the field to digits only and repaints the ghost layer underneath, so
// the X placeholders shrink as characters are typed.
function syncCode() {
  const d = codeDigits();
  // Rewriting value on every input also strips anything pasted that is not a
  // digit — "MB-483920" pastes cleanly as 483920.
  if ($("code").value !== d) $("code").value = d;
  $("g-typed").textContent = d;
  $("g-rest").textContent = "X".repeat(CODE_DIGITS - d.length);
  refreshButton();
}

function refreshButton() {
  const code = codeValue();
  const ready = Boolean(code && system && selected);
  $("save").disabled = !ready;
  $("save").textContent = "Save Configuration";
}

function say(text, kind) {
  const m = $("msg");
  m.textContent = text;
  m.className = `msg show ${kind}`;
}

function clearMessage() {
  const m = $("msg");
  m.textContent = "";
  m.className = "msg";
}

// ---------------------------------------------------------------- discovery

let discoveryDone = false;

// Discovery gained a "systems" map when MTA landed and stayed at schema
// version 1, because the change is additive: the top-level endpoints are still
// the WMATA pair and still mean what they always did. A stack that has not
// been redeployed since serves the old shape, so fall back to it rather than
// showing an empty picker.
function readStationUrls(disc) {
  const urls = {};
  const systems = disc.systems || {};
  for (const s of SYSTEMS) {
    const entry = systems[s.id];
    if (entry && entry.stationInfo) urls[s.id] = entry.stationInfo;
  }
  if (!urls.wmata && disc.endpoints && disc.endpoints.stationInfo) {
    urls.wmata = disc.endpoints.stationInfo;
  }
  return urls;
}

async function boot() {
  renderSystems();

  let reached = true;
  try {
    // no-store because discovery is served with max-age=86400, which is aimed
    // at the displays: they cache it for a day on purpose, since a device that
    // re-asks on every arrivals poll is the expensive thing. A browser has no
    // such reason — it reads this once per visit and it is a few hundred bytes
    // — and honouring that header meant a newly deployed system kept rendering
    // as "Not available yet" for up to a day after it went live, to exactly the
    // people most likely to be looking for it.
    const disc = await fetch(DISCOVERY_URL, { cache: "no-store" }).then((r) => r.json());
    stationUrls = readStationUrls(disc);
  } catch (err) {
    reached = false;
    say(`Couldn't reach the server: ${err.message}`, "err");
  }

  discoveryDone = true;
  renderSystems();

  const available = SYSTEMS.filter((s) => stationUrls[s.id]);
  if (!available.length) {
    // Only when the server answered and had nothing — otherwise this would
    // paper over the more specific message the catch above just wrote.
    if (reached) say("No transit systems are being served right now.", "err");
    return;
  }
  // With one system there is no choice to make, so don't make the user click
  // through it. This is the WMATA-only flow the page had before New York.
  if (available.length === 1) await selectSystem(available[0].id);
}

// ------------------------------------------------------------------- saving

async function save() {
  const code = codeValue();
  $("save").disabled = true;
  say("Saving…", "ok");

  try {
    const res = await fetch(`${API_BASE}/api/devices/${encodeURIComponent(code)}/config`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        system: system.id,
        stationId: selected.code,
        stationName: selected.name,
        // Omitted for a system with one board, which the server stores as ""
        // and the firmware reads as "this system's default" — the same thing
        // every device configured before this step existed already holds.
        ...(design === null ? {} : { design }),
        // Left out for a board that marks no arriving train, which the server
        // takes as "say nothing about it" and leaves whatever is stored alone —
        // saving a retro board must not decide anything about the modern one.
        //
        // The boolean this replaced, `blinkArriving`, is deliberately not sent
        // beside it: the server derives that for the firmware still asking for
        // it, and it cannot express "no effect" anyway.
        ...(effectApplies() ? { arrivingEffect } : {}),
        // And the same rule for BART's call-out: left out entirely for a board
        // that has none, so saving a New York display decides nothing about a
        // Bay Area one that shares the account.
        ...(takeoverApplies() ? { arrivingTakeover } : {}),
      }),
    });

    if (res.status === 404) {
      // The device registers itself on boot, so an unknown code almost always
      // means a typo — or a display that has never reached the server.
      say("No display with that code. Check the code on the screen, and that it's online.", "err");
      refreshButton();
      return;
    }
    if (!res.ok) {
      say(`Server said ${res.status}: ${await res.text()}`, "err");
      refreshButton();
      return;
    }

    say(`Saved! Changes will take effect within one minute.`, "ok");
  } catch (err) {
    say(`Couldn't reach the server: ${err.message}`, "err");
  } finally {
    refreshButton();
  }
}


// Reject non-digits before they land, so nothing flashes on screen and then
// disappears. Only single-character typing is blocked outright — a paste is
// let through and stripped by syncCode(), so "MB-483920" still works.
$("code").addEventListener("beforeinput", (e) => {
  if (e.inputType !== "insertText") return;
  if (!e.data || /\D/.test(e.data) || codeDigits().length >= CODE_DIGITS) {
    e.preventDefault();
  }
});
$("code").addEventListener("input", syncCode);
$("code").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !$("save").disabled) save();
});
syncCode();

$("search").oninput = (e) => renderList(e.target.value);
$("save").onclick = save;

$("systems").addEventListener("scroll", refreshSystemsScroll, { passive: true });
// A narrower window wraps card titles onto two lines, which changes whether
// the list overflows at all.
window.addEventListener("resize", refreshSystemsScroll);

boot();
</script>
</body>
</html>
